<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>title</title>
    <style type="text/css">
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 20px;
            max-width: 600px;
        }
        h1 {
            font-size: 1.5em;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }
        .info-row {
            margin-bottom: 10px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .label {
            font-weight: bold;
            color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Browser Information</h1>
        <div id="output">
            <p>Gathering browser data...</p>
            <noscript>
                <p style="color: red; font-weight: bold;">JavaScript is disabled or not supported by this browser.</p>
            </noscript>
        </div>
    </div>

    <script type="text/javascript">
        window.onload = function() {
            var outputDiv = document.getElementById("output");
            var html = "";

            function addInfo(label, value) {
                var displayValue = (value !== undefined && value !== null && value !== "") ? value : "Unknown";
                return "<div class='info-row'><span class='label'>" + label + ":</span> " + displayValue + "</div>";
            }
            html += addInfo("User Agent", navigator.userAgent);
            html += addInfo("App Name", navigator.appName);
            html += addInfo("App Version", navigator.appVersion);
            html += addInfo("Platform", navigator.platform);
            html += addInfo("Cookies Enabled", navigator.cookieEnabled);
            html += addInfo("Language", navigator.language || navigator.userLanguage);

            if (window.screen) {
                html += addInfo("Screen Resolution", screen.width + " x " + screen.height);
                html += addInfo("Color Depth", screen.colorDepth + "-bit");
            }

            outputDiv.innerHTML = html;
        };
    </script>

</body>
</html>
