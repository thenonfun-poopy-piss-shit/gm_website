<script>
    (function() {
        var missingFeatures = [];

        if (typeof Promise === "undefined" || Promise.toString().indexOf("[native code]") === -1) {
            missingFeatures.push("ES6 Promises");
        }

        if (typeof window.fetch === "undefined") {
            missingFeatures.push("Fetch API");
        }

        if (!window.CSS || !CSS.supports || !CSS.supports('color', 'var(--fake-var)')) {
            missingFeatures.push("CSS Variables Support");
        }

        try {
            eval("const a = async () => {}; let b = 1;");
        } catch (e) {
            missingFeatures.push("ES6 Syntax Parsing");
        }

        var canvas = document.createElement('canvas');
        var supportsWebP = false;
        if (!!(canvas.getContext && canvas.getContext('2d'))) {
            supportsWebP = canvas.toDataURL('image/webp').indexOf('data:image/webp') === 0;
        }
        
        var isEdgeHTML = window.navigator.userAgent.indexOf("Edge/") > -1;
        if (!supportsWebP && !isEdgeHTML) {
            missingFeatures.push("WebP Image Support");
        }

        if (missingFeatures.length > 0) {
            var errorUrl = "/pcerror.html?missing=" + encodeURIComponent(missingFeatures.join(", "));
            window.location.href = errorUrl;
        }
    })();
</script>
